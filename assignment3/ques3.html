<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Course Registration</title>
</head>
<body>
  <header>
    <h1>Course Registration</h1>
  </header>

  <main>
    <form action="#" method="post">
      <fieldset>
        <legend>Student Details</legend>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Choose a course:</label>
        <select id="course" name="course">
          <option value="webdev" selected>Web Development</option>
          <option value="data">Data Science</option>
          <option value="ux">UI/UX Design</option>
        </select>
      </fieldset>

      <p><button type="submit">Register</button></p>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1" title="Course Schedules">
      <thead>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Monday</td>
          <td>10:00 — 12:00</td>
          <td>Mr Ramesh goswami</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>14:00 — 16:00</td>
          <td>Mrs Anjali Kumari</td>
        </tr>
        <tr>
          <td>Saturday</td>
          <td>09:00 — 12:00</td>
          <td>Mr SatyaPrakash Singh</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Training Center • Training@ishikagupta.com</p>
  </footer>
</body>
</html>
