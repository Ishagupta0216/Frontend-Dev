<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box-Sizing Comparison</title>
  <link rel="stylesheet" href="ques8.css" />
</head>
<body>
  <main>
    <h1>Box-Sizing: Content-Box vs Border-Box</h1>
    <div class="box-container">
      <div class="box content-box">
        <p>Default: content-box</p>
      </div>
      <div class="box border-box">
        <p>box-sizing: border-box</p>
      </div>
    </div>
    <p class="description">
      Both boxes have the same width and padding, but border-box includes padding and border in the total size.
    </p>
  </main>
</body>
</html>
