<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="ques9.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <h2>Project Title</h2>
          <img src="tech.jpg" alt="Project Image" />
        </div>
        <div class="card-back">
          <p>This project showcases a responsive layout using Flexbox and Grid techniques.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
