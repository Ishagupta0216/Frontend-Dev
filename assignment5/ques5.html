<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ques5.css" />
  <title>Pricing Plans</title>
</head>
<body>
  <div class="pricing-table">
    <div class="plan">
      <h2>Basic</h2>
      <ul>
        <li>1 User</li>
        <li>5GB Storage</li>
        <li>Email Support</li>
      </ul>
      <p class="price">$9/month</p>
      <a href="#">Choose Plan</a>
    </div>
    <div class="plan popular">
      <h2>Standard</h2>
      <ul>
        <li>5 Users</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <p class="price">$29/month</p>
      <a href="#">Choose Plan</a>
    </div>
    <div class="plan">
      <h2>Premium</h2>
      <ul>
        <li>Unlimited Users</li>
        <li>200GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <p class="price">$59/month</p>
      <a href="#">Choose Plan</a>
    </div>
  </div>
</body>
</html>
