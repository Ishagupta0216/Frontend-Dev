<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ques6.css" />
  <title>Photo Gallery</title>
</head>
<body>
  <div class="gallery">
    <div class="photo">
      <img src="headphones.png" alt="Photo 1" />
      <div class="caption">These are headphones</div>
    </div>
    <div class="photo">
      <img src="purse.png" alt="Photo 2" />
      <div class="caption">This is purse</div>
    </div>
    <div class="photo">
      <img src="kyoto.png" alt="Photo 3" />
      <div class="caption">This is a picture of kyoto</div>
    </div>
    <div class="photo">
      <img src="london.png" alt="Photo 4" />
      <div class="caption">This is a picture of london</div>
    </div>
    
  </div>
</body>
</html>
