<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ques10.css" />
  <title>My Webpage</title>
</head>
<body>
  <header>
    <nav>
      <h1>MySite</h1>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Welcome to MySite</h2>
      <p>Your one-stop solution for web design</p>
    </div>
  </section>

  <section class="about">
    <div class="about-text">
      <h3>About Us</h3>
      <p>We are a creative team passionate about building beautiful websites.</p>
    </div>
    <img src="" alt="About Image" />
  </section>

  <section class="services">
    <div class="service-box">Design</div>
    <div class="service-box">Development</div>
    <div class="service-box">SEO</div>
  </section>

  <section class="contact">
    <form>
      <input type="text" placeholder="Your Name" />
      <input type="email" placeholder="Your Email" />
      <textarea placeholder="Your Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 MySite. All rights reserved.</p>
  </footer>
</body>
</html>
